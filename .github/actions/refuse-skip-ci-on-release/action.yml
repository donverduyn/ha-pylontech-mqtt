name: Enforce skip-ci scope
description: >
  Fails when skip-ci is used on a release PR. Shared by detect-release.yaml's
  early signal and the required HACS/Hassfest jobs; tests.yaml repeats the
  check in its summary job because that job intentionally has no checkout.
  skip-ci is otherwise unrestricted -- see detect-release.yaml's header for
  why the documentation-only restriction was removed and why this one stays.

inputs:
  is_release:
    required: true
    description: "'true' if this PR bumps manifest.json's version"
  skip_ci:
    required: true
    description: "'true' if the skip-ci label is currently on this PR"

runs:
  using: composite
  steps:
    - if: inputs.skip_ci == 'true' && inputs.is_release == 'true'
      shell: bash
      run: |
        echo "::error::skip-ci cannot be used on a release PR: autorelease.yaml requires a real successful tests-finished before it will publish. Remove the label."
        exit 1

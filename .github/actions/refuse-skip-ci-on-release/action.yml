name: Enforce skip-ci scope
description: >
  Fails when skip-ci is used for a release or for anything other than a
  documentation-only change. Shared by detect-release.yaml's early signal and
  the required HACS/Hassfest jobs; tests.yaml repeats the check in its summary
  job because that job intentionally has no checkout.

inputs:
  is_release:
    required: true
    description: "'true' if this PR bumps manifest.json's version"
  skip_ci:
    required: true
    description: "'true' if the skip-ci label is currently on this PR"
  skip_ci_allowed:
    required: true
    description: "'true' if every changed path is documentation-only"

runs:
  using: composite
  steps:
    - if: >-
        inputs.skip_ci == 'true' &&
        (inputs.is_release == 'true' || inputs.skip_ci_allowed != 'true')
      shell: bash
      run: |
        echo "::error::skip-ci is limited to documentation-only, non-release PRs — remove the label."
        exit 1

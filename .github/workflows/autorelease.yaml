name: Auto-release

# A push that changes manifest.json's version is a deliberate release request.
# Tests runs only while the change is a PR. Before publishing, reuse the
# successful pull-request-triggered Tests run associated with this merge
# commit instead of running the full suite again on master.
on:
  push:
    branches:
      - master

permissions: {}

# Preserve every queued version bump. Without queue:max, GitHub keeps only one
# pending run and may silently supersede an intermediate release event.
concurrency:
  group: autorelease-detection
  cancel-in-progress: false
  queue: max

jobs:
  detect:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether this push changed the manifest version
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          manifest="custom_components/pylontech_mqtt/manifest.json"
          new="$(jq -er .version "$manifest")"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            old=""
          else
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              echo "::error::Push predecessor $BEFORE_SHA is unavailable; refusing to infer the version diff from HEAD^."
              exit 1
            fi
            old="$(git show "$BEFORE_SHA:$manifest" 2>/dev/null | jq -er .version)"
          fi

          if [ "$new" = "$old" ]; then
            echo "Version unchanged ($new) — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$new"
          set +e
          existing_tag="$(
            git ls-remote --exit-code --tags origin \
              "refs/tags/$tag" "refs/tags/$tag^{}" 2>&1
          )"
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "::warning::Version changed $old -> $new, but $tag already exists; not overwriting an immutable release."
              echo "$existing_tag"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            2)
              ;;
            *)
              echo "::error::Could not determine whether $tag exists."
              echo "$existing_tag"
              exit 1
              ;;
          esac

          echo "Version changed ${old:-<none>} -> $new; release tag is $tag."
          {
            echo "release=true"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  require-pr-tests:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Require the merged PR's Tests run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Reads both values through jq's $ENV rather than interpolating them
          # into the filter text, so neither can alter the program itself.
          # shellcheck disable=SC2016 # $ENV.* is jq syntax, not shell expansion
          merged_pr="$(
            gh api "repos/$REPO/commits/$TARGET_SHA/pulls" \
              --jq '[.[] | select(
                .merged_at != null and
                .merge_commit_sha == $ENV.TARGET_SHA and
                .base.ref == $ENV.DEFAULT_BRANCH
              )] | if length == 1 then .[0] else empty end'
          )"
          if [ -z "$merged_pr" ]; then
            echo "::error::Release commit $TARGET_SHA is not the merge commit of exactly one PR into $DEFAULT_BRANCH."
            exit 1
          fi

          pr_number="$(jq -r .number <<< "$merged_pr")"
          pr_head_sha="$(jq -r .head.sha <<< "$merged_pr")"
          run_id="$(
            gh run list --repo "$REPO" --workflow tests.yaml \
              --event pull_request --commit "$pr_head_sha" --limit 20 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | .[-1].databaseId // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "::error::No pull-request-triggered Tests run exists for PR #$pr_number head $pr_head_sha."
            exit 1
          fi

          echo "Reusing Tests run $run_id from PR #$pr_number ($pr_head_sha)."
          gh run watch "$run_id" --repo "$REPO" --exit-status

          # A run whose jobs were all skipped also concludes "success", so the
          # watch above is not by itself proof the suite ran. tests-finished is
          # the required summary job (see tests.yaml): require *it* to have
          # succeeded for real. A release PR can never legitimately skip it --
          # skip-ci is refused outright on any PR that bumps manifest.json's
          # version (detect-release.yaml and .github/actions/
          # refuse-skip-ci-on-release), which is exactly what makes a PR a
          # release -- so this only ever rejects a release that genuinely was
          # not tested. (skip-ci is otherwise unrestricted on non-release PRs;
          # it used to additionally require documentation-only changed paths,
          # and that restriction was removed -- see detect-release.yaml's
          # header.)
          summary="$(
            gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "tests-finished")]
                    | if length == 1 then .[0].conclusion else empty end'
          )"
          if [ "$summary" != "success" ]; then
            echo "::error::Tests run $run_id has no single successful tests-finished job (got: ${summary:-none})."
            exit 1
          fi
          echo "tests-finished succeeded in run $run_id."

  release:
    needs: [detect, require-pr-tests]
    if: >-
      needs.detect.outputs.release == 'true' &&
      needs.require-pr-tests.result == 'success'
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.detect.outputs.tag }}

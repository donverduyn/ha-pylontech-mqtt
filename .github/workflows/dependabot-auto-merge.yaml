name: PR Auto-merge

# Runs daily (plus manual dispatch) — deliberately never on push or
# PR-activity events. Auto-merge must not react to PR activity; see the
# schedule-only project memory for why. Every daily pass walks every open
# PR oldest-first, one fully handled before the next is even looked at:
# rebase it onto the current base branch (Dependabot and human alike,
# drafts excluded), and if it's a Dependabot grouped patch/minor update,
# wait for its required checks and merge it for real before moving on --
# so a later PR's rebase in the same run picks up an earlier one's merge.
# Individual/major Dependabot updates and every human PR only ever get
# rebased here -- this workflow never merges a human PR, and never touches
# a human PR's own auto-merge choice; that stays a maintainer call.
on:
  workflow_dispatch:
  schedule:
    - cron: "22 8 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-open-prs:
    runs-on: "ubuntu-latest"
    # Bounded well under the App installation token's ~1-hour lifetime.
    # daily-pr-sync.sh caps its own total check-waiting at RUN_BUDGET_SECONDS
    # (well under this), so it stops merging and leaves the rest rebased
    # for tomorrow before this ceiling is ever hit -- this timeout is a
    # backstop, not the thing normally doing the cutting off.
    timeout-minutes: 55
    environment: automation
    permissions:
      contents: read
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: ./.github/actions/automation-app-token
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Rebase every open PR; merge eligible Dependabot groups in order
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/daily-pr-sync.sh

name: Dependency Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions: {}

concurrency:
  # Deliberately this workflow's own group, not the dependency-pr-maintenance
  # one dependabot-auto-merge.yaml and close-stale-automation-prs.yaml share.
  # This run does race PR Auto-merge -- daily-pr-sync.sh rebases every open PR,
  # including this one's automation/dependency-updates branch, and on Mondays
  # the two crons are five minutes apart -- but that race is a stale
  # --force-with-lease, and it is fixed where it happens, in
  # create-or-update-pr's push (see its comment). Serializing the two
  # workflows would not even close it (gh pr update-branch applies the rebase
  # asynchronously, so it can land after PR Auto-merge's run ends and the lock
  # releases) while costing this weekly refresh up to an hour queued behind a
  # 55-minute maintenance run.
  group: dependency-updates
  cancel-in-progress: true

jobs:
  update:
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    # Store the App private key in this environment and restrict it to the
    # default branch in repository settings.
    environment: automation
    steps:
      - name: Refuse manual execution from a non-default branch
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Dependency automation may only run from the default branch."
          exit 1

      # This cannot use the local automation-app-token composite because the
      # repository has not been checked out yet. The resulting token is not
      # persisted by checkout; create-or-update-pr exposes it to git only in
      # the final publication step.
      - name: Create GitHub App token
        id: app-token
        uses: "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1" # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          # No permission-workflows: write here, unlike
          # min-ha-version-update.yaml. That grant lets a token push files
          # under .github/workflows/, and the only writer of one is
          # update_tests_workflow_min_python(), reachable solely through
          # refresh_min_ha_version() -- i.e. only under
          # --min-ha-version-only, which this workflow does not pass. The
          # dependabot.yml this run does rewrite is ordinary repository
          # content, not a workflow file. Worth keeping tight specifically
          # here: this is the one automation token whose PR auto-merges
          # below, so it is the only one that could land a workflow change
          # without a human ever looking at it.
          permission-contents: write
          permission-pull-requests: write

      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: "astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9" # v9.0.0
        with:
          python-version: "3.14"
          cache-dependency-glob: |
            requirements*.txt
            uv.toml
            .devcontainer/tool-versions.env

      - name: Update dependency constraints and pins
        run: make update-deps

      - name: Open or update dependency PR
        id: pr
        uses: ./.github/actions/create-or-update-pr
        with:
          branch: automation/dependency-updates
          base-branch: ${{ github.event.repository.default_branch }}
          commit-message: "Update dependency constraints and pins"
          pr-title: "Update dependency constraints and pins"
          pr-body: |
            Automated dependency refresh generated by \`make update-deps\`.

            This updates devcontainer feature/tool constraints, exact non-npm
            pins, generated Python requirement lock files, the pinned uv
            requirement, and Dependabot generated exact-pin ignores together.
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge
        if: steps.pr.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: automation/dependency-updates
        run: |
          # No --delete-branch here, unlike daily-pr-sync.sh's synchronous
          # merge: --auto only *enables* auto-merge and returns, so the merge
          # itself happens later with no gh process left to delete anything.
          # Cleaning up this branch is the repository's "automatically delete
          # head branches" setting to do; the branch is recreated from scratch
          # by the next scheduled run either way.
          gh pr merge "$BRANCH" --auto --squash \
            || echo "Could not enable auto-merge; leaving the PR for review."

name: Review Stale Automation PRs

# Every stale automation-owned or Dependabot PR is recycled by closing it,
# with one exemption (below):
#
# - automation/dependency-updates auto-merges on its own once CI passes, so
#   a stale instance almost always means CI is blocked, not that a decision
#   is pending.
# - automation/min-ha-version-update never auto-merges (dropping HA version
#   support is a maintainer decision, not a mechanical bump) and is
#   recreated weekly regardless of whether the previous instance is still
#   open — create-or-update-pr only *updates* a branch's PR if one is still
#   open, so closing a stale one costs nothing: the next scheduled run just
#   opens a fresh PR from current dependency state instead. The pending
#   maintainer decision isn't lost, just deferred to whichever instance is
#   open when someone actually reviews it.
# - Dependabot exact-pin updates are suppressed in dependabot.yml before a PR
#   opens. Any remaining stale non-major Dependabot PR is therefore an ordinary
#   blocked or outdated automation result, not a release decision; recycling it
#   lets Dependabot reassess the update from the current dependency state.
#
# The exemption: a *confirmed* major-version-bump Dependabot PR (per
# .github/scripts/dependabot-bump-kind.sh, shared with
# dependabot-auto-merge.yaml's own auto-merge decision) is never closed by
# age alone. GitHub only blocks Dependabot from recreating that exact
# proposed version once a PR is closed — not the dependency, and not any
# newer release under the same major — so a dependency with a sparse release
# cadence could have its one "a major bump is pending" signal closed here
# and then never resurface, since nothing would trigger Dependabot to
# re-propose it. Only a "major" classification exempts; "minor-or-patch" and
# "unknown" both still close on the generic staleness rule below — an
# unclassifiable PR sitting exempt forever would defeat this job's purpose
# for exactly the ecosystems/PR formats dependabot-bump-kind.sh can't parse.
# This doesn't trade away real cleanup: dependabot-auto-merge.yaml's
# daily-pr-sync.sh already runs a supersession check against every
# individual/major Dependabot PR on its own daily schedule (more often than
# this job's weekly one) and closes it for real once the base branch
# actually resolves the update some other way — this job's blind age-based
# sweep was never the only thing capable of closing a genuinely-resolved
# major, so exempting it here loses nothing except closing one that was
# still genuinely pending.
#
# Correctness does not depend on the relative start time of the two
# producer crons (dependency-updates.yaml 08:17, min-ha-version-update.yaml
# 08:30): scheduled workflows can be delayed or dropped by GitHub, and a
# stale PR refreshed by one of them moments before this runs is still
# correctly closed per the reasoning above.
#
# The one ordering this DOES depend on: dependabot-auto-merge.yaml (PR
# Auto-merge) can still be actively rebasing/waiting-on-checks/merging a
# Dependabot PR when this runs. That ordering is enforced by the shared
# dependency-pr-maintenance concurrency group below, which queues this behind
# any in-flight maintenance run whatever triggered either of them.
#
# This used to be a workflow_run trigger on PR Auto-merge's completion
# instead, on the reasoning that cron spacing cannot order two independently
# delayed schedules. The concurrency group makes that ordering unconditional,
# so all workflow_run added on top of it was fragility: it made Monday's PR
# Auto-merge cron firing, that run being the scheduled one rather than a
# dispatch, and its concluding success into three independent preconditions
# for the sweep happening at all, any one of which cost a full week when it
# missed. GitHub delays and drops scheduled runs under load and disables
# schedules outright after 60 days of repository inactivity, so those misses
# are real. A plain weekly cron has one precondition instead of three, and
# encodes "Monday" once (here) rather than in both a cron and a `date +%u`
# comparison in the run step. It fires at 09:30 UTC, past PR Auto-merge's
# 08:22 start plus its 55-minute ceiling, so in the normal case it does not
# even queue.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1"

permissions: {}

concurrency:
  group: dependency-pr-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  review-stale:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      # pull-requests: write covers both actions this job takes on a PR --
      # closing it and posting the explanatory comment. A PR comment is
      # created through the shared issue-comments endpoint, but for a pull
      # request that endpoint accepts pull-requests: write; `issues: write`
      # used to be granted alongside and was never needed.
      # contents: write is for the head-branch ref deletion after the close.
      contents: write
      pull-requests: write
    steps:
      # Needed only to run .github/scripts/dependabot-bump-kind.sh -- this
      # job otherwise works entirely through the gh API against
      # $GITHUB_REPOSITORY, not the checked-out tree.
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: Review stale dependency-automation PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs="$(
            gh pr list --repo "$REPO" --state open --limit 1000 \
              --json number,author,headRefName,createdAt,title,body
          )"

          if [ "$(echo "$prs" | jq 'length')" = "0" ]; then
            echo "No open PRs."
            exit 0
          fi

          now="$(date +%s)"
          while read -r pr; do
            number="$(echo "$pr" | jq -r .number)"
            author="$(echo "$pr" | jq -r '.author.login // ""')"
            head_ref="$(echo "$pr" | jq -r .headRefName)"
            created_at="$(echo "$pr" | jq -r .createdAt)"
            created_epoch="$(date -d "$created_at" +%s)"
            age_days=$(( (now - created_epoch) / 86400 ))

            is_dependabot=false
            if [ "$author" = "dependabot[bot]" ] \
              || [ "$author" = "app/dependabot" ]; then
              is_dependabot=true
            fi

            is_major_bump=false
            if [ "$is_dependabot" = "true" ]; then
              title="$(echo "$pr" | jq -r .title)"
              body="$(echo "$pr" | jq -r .body)"
              if [ "$(.github/scripts/dependabot-bump-kind.sh "$title" "$body")" = "major" ]; then
                is_major_bump=true
              fi
            fi

            is_recyclable=false
            if [ "$head_ref" = "automation/dependency-updates" ] \
              || [ "$head_ref" = "automation/min-ha-version-update" ]; then
              is_recyclable=true
            elif [ "$is_dependabot" = "true" ] && [ "$is_major_bump" != "true" ]; then
              is_recyclable=true
            fi

            if [ "$is_major_bump" = "true" ]; then
              echo "::group::PR #$number ($author, $head_ref)"
              echo "Confirmed major-version bump — exempt from staleness close, left for a human merge decision. daily-pr-sync.sh's own supersession check still closes it if the base branch resolves the update some other way."
              echo "::endgroup::"
            fi

            if [ "$is_recyclable" != "true" ]; then
              continue
            fi

            echo "::group::PR #$number ($author, $head_ref)"
            if [ "$age_days" -lt 7 ]; then
              echo "Open $age_days days — not stale."
              echo "::endgroup::"
              continue
            fi

            if [ "$is_dependabot" = "true" ]; then
              comment="Closing this stale Dependabot PR. This repository's homeassistant/pytest-homeassistant-custom-component pins are managed by scripts/update_dependencies.py, not by direct Dependabot updates, so this PR was never going to resolve as opened. If the underlying advisory is still relevant once that script's next scheduled run lands, Dependabot will surface it again."
            elif [ "$head_ref" = "automation/min-ha-version-update" ]; then
              comment="Closing this stale minimum-HA-version bump PR. It is recreated weekly regardless of whether a previous instance is still open, so closing here just avoids carrying a stale, possibly-conflicting draft between runs. The next scheduled run opens a fresh PR from current dependency state; dropping support for an older Home Assistant version still needs a maintainer decision before merging, that decision isn't lost, just deferred to whichever instance is open when someone reviews it."
            else
              comment="Closing this stale repository-owned automation PR. Its next scheduled producer run will create a fresh branch and PR from the current dependency state."
            fi
            gh pr close "$number" --repo "$REPO" --comment "$comment"

            # Best effort: the PR is already closed even if branch deletion
            # is temporarily rejected.
            gh api "repos/$REPO/git/refs/heads/$head_ref" -X DELETE \
              >/dev/null 2>&1 \
              && echo "Deleted branch $head_ref." \
              || echo "Could not delete branch $head_ref; leaving it in place."
            echo "::endgroup::"
          done < <(echo "$prs" | jq -c '.[]')
